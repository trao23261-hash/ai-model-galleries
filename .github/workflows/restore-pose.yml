name: Restore verified pose archive once
on:
  push:
    branches: [main]
    paths: ['.archive-bootstrap/pose.trigger']
permissions:
  contents: write
concurrency:
  group: restore-pose-archive-once
  cancel-in-progress: false
jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Restore exact public snapshot and verify every file
        run: python3 .archive-bootstrap/restore_pose.py
      - name: Commit verified archive and remove bootstrap inputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pose/
          git rm -r .archive-bootstrap/
          git commit -m 'Archive verified pose gallery: 1439 originals and 1439 thumbnails'
          git push origin HEAD:main
