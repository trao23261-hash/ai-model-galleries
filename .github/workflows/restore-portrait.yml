name: Restore verified portrait archive once
on:
  push:
    branches: [main]
    paths: ['.archive-bootstrap/portrait.trigger']
permissions:
  contents: write
concurrency:
  group: archive-gallery-upload-once
  cancel-in-progress: false
jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Restore, verify and push bounded archive batches
        run: python3 .archive-bootstrap/restore_batched.py
