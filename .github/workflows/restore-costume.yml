name: Restore verified costume archive once
on:
  push:
    branches: [main]
    paths: ['.archive-bootstrap/costume.trigger']
permissions:
  contents: write
concurrency:
  group: archive-gallery-upload-once
  cancel-in-progress: false
jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            .archive-bootstrap
            costume
      - name: Restore, verify and push bounded archive batches
        run: python3 .archive-bootstrap/restore_batched.py
